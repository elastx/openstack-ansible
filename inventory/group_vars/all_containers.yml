# This is the default LXC AppArmor profile
# Groups which need the unbound profile have a specific override
# 24.04 hosts use LXC's generated profile with nesting; 22.04 keeps lxc-openstack
# so existing containers' configs are unchanged and are not restarted
lxc_container_config_list: >-
  {%- set _distro = hostvars[physical_host]['ansible_facts']['distribution'] -%}
  {%- set _noble = _distro != 'Debian' and hostvars[physical_host]['ansible_facts']['distribution_version'] is version('24.04', '>=') -%}
  {{ ['lxc.apparmor.profile=' ~ ('unconfined' if _distro == 'Debian' else ('generated' if _noble else 'lxc-openstack'))]
     + (['lxc.apparmor.allow_nesting=1'] if _noble else []) }}

# Needed by playbooks/common-tasks/os-lxc-container-setup.yml
lxc_container_log_path: "/var/log/lxc"

## Parameters provided to the wait_for_connection module after a container
## reboot is triggered by the playbook
lxc_container_wait_params:
  # Wait 3 seconds before attempting the first connection
  delay: 3
  # Wait 60 seconds for the container to respond
  timeout: 60
