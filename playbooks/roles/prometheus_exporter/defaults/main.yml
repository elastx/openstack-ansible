---
prometheus_exporter_interface: ens18
prometheus_exporter_apply_rule: false
prometheus_exporter_user: prometheus
prometheus_exporter_group: prometheus
prometheus_exporter_groups: "{{ prometheus_exporter_group }},adm"

# Node exporter
node_exporter_enabled: true
node_exporter_install_dir: /usr/bin
node_exporter_bin: node_exporter
node_exporter_version: 1.6.1
node_exporter_download_sha256_checksum: ecc41b3b4d53f7b9c16a370419a25a133e48c09dfc49499d63bcc0c5e0cf3d01
node_exporter_port: 9100
node_exporter_textfile_collector_dir: /var/lib/node_exporter/textfile_collector
node_exporter_flags: "--collector.textfile.directory {{ node_exporter_textfile_collector_dir }}"
node_exporter_collector_dir: /var/lib/node_exporter/collectors
prometheus_collectors:
  Ubuntu:
    - { name: "gpu_capacity", filending: "py", pre_script: ". /root/openrc && ", minute: "*/5" }
    - { name: "billing_summary", filending: "py", pre_script: ". /root/openrc && ", minute: "1" }

# OpenStack capacity metrics publisher
#
# Runs openstack-capacity-metrics on ONE utility container per environment
# once per hour: it collects the Placement-aware hypervisor capacity snapshot
# (openstack_hypervisor_* / openstack_capacity_scrape_* metric families) and
# publishes it atomically into node_exporter's textfile directory, so the
# data rides the platform's existing Prometheus scrape. Not a
# prometheus_collectors entry: that cron line supports no arguments and
# redirects stdout straight into the .prom file, which neither allows the
# collector's own arguments nor an atomic write.
openstack_capacity_metrics_enabled: true
openstack_capacity_metrics_dir: /usr/local/lib/openstack-capacity-metrics
openstack_capacity_metrics_textfile: "{{ node_exporter_textfile_collector_dir }}/openstack_capacity.prom"
openstack_capacity_metrics_cadence: "60min"
# Prepended to PATH in the service unit so the collector finds the openstack
# CLI in the OSA utility venv; empty when no venv_tag is set for the host.
openstack_capacity_metrics_venv_bin: "{{ '/openstack/venvs/utility-' ~ venv_tag ~ '/bin' if venv_tag is defined else '' }}"
