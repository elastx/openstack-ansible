---
- name: restart node_exporter
  ansible.builtin.service:
    name: node_exporter
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"
  become: true

- name: restart openstack-capacity-metrics
  ansible.builtin.service:
    name: openstack-capacity-metrics
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
